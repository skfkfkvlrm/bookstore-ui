<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Library System - Add New Member</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "card-light": "#ffffff",
                        "card-dark": "#1a2632",
                        "border-light": "#e5e7eb",
                        "border-dark": "#374151",
                        "text-light-primary": "#1f2937",
                        "text-dark-primary": "#f9fafb",
                        "text-light-secondary": "#6b7280",
                        "text-dark-secondary": "#9ca3af",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light-primary dark:text-dark-primary">
    <div class="flex h-screen">
        <aside class="w-64 flex-shrink-0 bg-card-light dark:bg-card-dark border-r border-border-light dark:border-border-dark flex-col hidden md:flex">
            <div class="h-16 flex items-center px-6 gap-3">
                <h1 class="text-xl font-bold">Spring Library</h1>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                 <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg text-text-light-secondary dark:text-dark-secondary hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20">
                    <span class="material-symbols-outlined">dashboard</span> Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-primary/10 dark:bg-primary/20 text-primary font-bold">
                    <span class="material-symbols-outlined">group</span> Members
                </a>
                </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 flex items-center justify-end px-6 border-b border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark flex-shrink-0">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-light-secondary dark:text-dark-secondary">search</span>
                        <input type="text" placeholder="Search" class="bg-background-light dark:bg-background-dark border-none rounded-lg pl-10 pr-4 py-2 w-64 focus:ring-2 focus:ring-primary focus:outline-none" />
                    </div>
                    <button class="p-2 rounded-full hover:bg-background-light dark:hover:bg-background-dark">
                        <span class="material-symbols-outlined text-text-light-secondary dark:text-dark-secondary">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-10 w-10" style='background-image: url("https://i.pravatar.cc/40?u=sarah");'></div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6">
                <div class="max-w-4xl mx-auto">
                    <div class="mb-6">
                        <h2 class="text-3xl font-bold">Add New Member</h2>
                        <p class="text-text-light-secondary dark:text-dark-secondary mt-1">Create a new member profile.</p>
                    </div>

                    <div class="bg-card-light dark:bg-card-dark rounded-lg shadow-sm border border-border-light dark:border-border-dark">
                        <div class="p-6 border-b border-border-light dark:border-border-dark">
                            <h3 class="text-xl font-semibold">Member Information</h3>
                            <p class="text-sm text-text-light-secondary dark:text-dark-secondary mt-1">Please fill out the form below.</p>
                        </div>
                        <form class="p-6 space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="name" class="block text-sm font-medium mb-1">Full Name</label>
                                    <input type="text" id="name" placeholder="e.g., Sophia Clark" class="w-full bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:outline-none">
                                </div>
                                <div>
                                    <label for="email" class="block text-sm font-medium mb-1">Email Address</label>
                                    <input type="email" id="email" placeholder="e.g., sophia.c@email.com" class="w-full bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="membership-type" class="block text-sm font-medium mb-1">Membership Type</label>
                                    <select id="membership-type" class="w-full bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:outline-none">
                                        <option>Standard</option>
                                        <option>Premium</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="join-date" class="block text-sm font-medium mb-1">Join Date</label>
                                    <input type="date" id="join-date" class="w-full bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:outline-none">
                                </div>
                            </div>
                            <div class="flex justify-end gap-4 pt-4">
                                <button type="button" class="px-4 py-2 bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-lg hover:bg-background-light dark:hover:bg-background-dark/50">Cancel</button>
                                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-primary/90">
                                    <span class="material-symbols-outlined">add</span>
                                    Add Member
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
			 <footer class="text-center p-4 text-sm text-text-light-secondary dark:text-dark-secondary border-t border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark">
                © 2024 Spring Library System. All rights reserved.
            </footer>
        </div>
    </div>
</body>
</html>
